<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drag and Drop File Upload</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/min/dropzone.min.css">
    <style>
        body {
            font-family: sans-serif;
            padding: 2em;
        }

        #upload-messages {
            margin-top: 1em;
            padding: 1em;
            background-color: #e6ffe6;
            border: 1px solid #b2d8b2;
            border-radius: 4px;
            color: #2d662d;
            align-items: flex-start;
        }

        #file-type-container select,
        #cruise-name-container input {
            padding: 4px;
            font-size: 14px;
            width: 200px;
        }

        #upload-messages-text {
            margin-left: 1em;
            white-space: pre-wrap;
        }

        #file-type {
            padding: 4px;
            font-size: 14px;
        }


    </style>
</head>
<body>

    <h1>📂 Drag and Drop Your Files</h1>

    <!-- Upload messages container -->
    <div id="upload-messages">
        <div style="display: flex; gap: 4em; align-items: flex-end; margin-bottom: 1em;">
            <div id="file-type-container">
                <label for="file-type"><strong>Select File Type:</strong></label><br>
                <select id="file-type" name="file_type">
                    <option value="ctd">CTD</option>
                    <option value="elog">Elog</option>
                    <option value="underway">Underway</option>
                    <option value="nutrient">LTERnut.xlsx</option>
                    <option value="sample_log">LTER_sample_log.xlsx</option>
                    <option value="station_list">NES-LTER_station_list_compilation.xlsx</option>
                    <option value="cruise_types">NES-LTER_cruise_types.csv</option>
                    <option value="hplc">Sosik*report.xlsx</option>
                    <option value="chlorophyll">NESLTERchl.xlsx</option>
                </select>
            </div>

            <div id="cruise-name-container" style="display: flex; align-items: center; gap: 0.5em; margin-left: 2em;">
                <label for="cruise-name"><strong>Cruise Name:</strong></label>
                <input type="text" id="cruise-name" name="cruise_name" placeholder="Enter cruise name">
            </div>
        </div>

        <div id="upload-messages-text" style="margin-top: 1em;"></div>
    </div>


    <!-- Batch controls -->
    <div id="upload-controls" style="margin: 1em 0; display: flex; gap: 0.5em; align-items: center;">
        <button type="button" id="select-folder-btn">Select folder…</button>
        <button type="button" id="upload-all-btn" disabled>Upload all (0)</button>
        <button type="button" id="clear-btn" disabled>Clear</button>
        <input type="file" id="folder-input" webkitdirectory multiple hidden>
        <span style="color: #666;">Drop files or a folder below (or click the box to pick files), then click Upload all.</span>
    </div>

    <!-- Dropzone form -->
    <form action="{% url 'file-upload' %}" class="dropzone" id="myDropzone" enctype="multipart/form-data">
        {% csrf_token %}
    </form>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/min/dropzone.min.js"></script>

    <script>
        function toggleCruiseNameField() {
            const fileType = document.getElementById("file-type").value;
            const cruiseContainer = document.getElementById("cruise-name-container");
            const cruiseInput = document.getElementById("cruise-name");

            if (["ctd", "elog", "underway"].includes(fileType)) {
                cruiseContainer.style.display = "block";
                cruiseInput.required = true;
            } else {
                cruiseContainer.style.display = "none";
                cruiseInput.required = false;
            }
        }

        // Run on page load and on change
        document.getElementById("file-type").addEventListener("change", toggleCruiseNameField);
        window.addEventListener("DOMContentLoaded", toggleCruiseNameField);
    </script>

    <script>
        Dropzone.options.myDropzone = {
            paramName: "file",
            maxFilesize: 100, // MB
            dataType: 'json',
            // Queue files and send them one at a time: the server runs the
            // cruise imports on every upload, so parallel requests would race.
            autoProcessQueue: false,
            parallelUploads: 1,
            addRemoveLinks: true,
            headers: {
                "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            init: function () {
                const dz = this;
                const messagesDiv = document.getElementById("upload-messages-text");
                const uploadBtn = document.getElementById("upload-all-btn");
                const clearBtn = document.getElementById("clear-btn");
                const folderBtn = document.getElementById("select-folder-btn");
                const folderInput = document.getElementById("folder-input");

                let uploading = false;
                let overwrite = false;
                let conflicts = [];
                let savedCount = 0;

                function addLine(text, color, detail) {
                    const el = document.createElement(detail ? "details" : "p");
                    if (detail) {
                        const summary = document.createElement("summary");
                        summary.textContent = text;
                        el.appendChild(summary);
                        const body = document.createElement("div");
                        body.textContent = detail;
                        el.appendChild(body);
                    } else {
                        el.textContent = text;
                    }
                    if (color) el.style.color = color;
                    messagesDiv.appendChild(el);
                }

                function refreshControls() {
                    const n = dz.getQueuedFiles().length;
                    uploadBtn.textContent = `Upload all (${n})`;
                    uploadBtn.disabled = uploading || n === 0;
                    clearBtn.disabled = uploading || dz.files.length === 0;
                    folderBtn.disabled = uploading;
                }

                function startUpload() {
                    const fileType = document.getElementById("file-type").value;
                    const cruiseName = document.getElementById("cruise-name").value.trim();
                    if (["ctd", "elog", "underway"].includes(fileType) && !cruiseName) {
                        alert("Cruise name is required for " + fileType + " files.");
                        return;
                    }
                    uploading = true;
                    overwrite = false;
                    conflicts = [];
                    savedCount = 0;
                    messagesDiv.innerHTML = "";
                    refreshControls();
                    dz.processQueue();
                }

                uploadBtn.addEventListener("click", startUpload);
                clearBtn.addEventListener("click", function () { dz.removeAllFiles(true); });
                folderBtn.addEventListener("click", function () { folderInput.click(); });
                folderInput.addEventListener("change", function () {
                    Array.from(folderInput.files).forEach(function (f) {
                        if (!f.name.startsWith(".")) dz.addFile(f);  // skip .DS_Store etc.
                    });
                    folderInput.value = "";
                });

                // addedfile fires before the file is queued, so refresh after it is
                this.on("addedfile", function () { setTimeout(refreshControls, 0); });
                this.on("removedfile", refreshControls);

                this.on("sending", function (file, xhr, formData) {
                    const fileType = document.getElementById("file-type").value;
                    const cruiseName = document.getElementById("cruise-name").value;

                    formData.append("file_type", fileType);
                    formData.append("cruise_name", cruiseName);
                    formData.append("overwrite", overwrite ? "true" : "false");
                    formData.append("skip_import", "true");  // import once after the whole batch

                    const n = dz.getQueuedFiles().length + dz.getUploadingFiles().length;
                    const waitMsg = document.getElementById("upload-wait");
                    if (waitMsg) waitMsg.remove();
                    const wait = document.createElement("p");
                    wait.id = "upload-wait";
                    wait.style.fontStyle = "italic";
                    wait.textContent = `⏳ Please wait... Uploading and processing ${file.name} (${n} remaining).`;
                    messagesDiv.appendChild(wait);
                });

                this.on("success", function (file, response) {
                    savedCount++;
                    addLine("✓ " + file.name + " saved");
                });

                this.on("error", function (file, errorMessage, xhr) {
                    let text = typeof errorMessage === "string" ? errorMessage : "Upload failed.";
                    if (xhr && xhr.response) {
                        try {
                            const responseJson = JSON.parse(xhr.response);
                            if (responseJson.conflict) {
                                // collect; ask once when the whole batch is done
                                conflicts.push(file);
                                addLine("⚠ " + file.name + ": already exists", "#a05a00");
                                return;
                            }
                            text = responseJson.error || "Upload failed.";
                        } catch (e) {
                            text = "Unexpected upload error.";
                        }
                    }
                    addLine("✗ " + file.name + ": " + text, "red");
                });

                this.on("complete", function () {
                    if (dz.getQueuedFiles().length > 0) {
                        dz.processQueue();
                    }
                });

                this.on("queuecomplete", function () {
                    const wait = document.getElementById("upload-wait");
                    if (wait) wait.remove();

                    if (conflicts.length > 0 && !overwrite) {
                        const names = conflicts.map(f => f.name);
                        const shown = names.slice(0, 10).join("\n") + (names.length > 10 ? `\n...and ${names.length - 10} more` : "");
                        if (confirm(`${names.length} file(s) already exist:\n\n${shown}\n\nDo you want to overwrite them?`)) {
                            overwrite = true;
                            const retry = conflicts;
                            conflicts = [];
                            retry.forEach(function (f) {
                                f.status = Dropzone.ADDED;
                                if (f.previewElement) f.previewElement.classList.remove("dz-error");
                                dz.enqueueFile(f);
                            });
                            dz.processQueue();
                            return;
                        }
                    }
                    runImport();
                });

                // One import for the whole batch, after every file is saved.
                function runImport() {
                    if (savedCount === 0) {
                        uploading = false;
                        refreshControls();
                        return;
                    }
                    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
                    const body = new FormData();
                    body.append("file_type", document.getElementById("file-type").value);
                    body.append("cruise_name", document.getElementById("cruise-name").value);
                    body.append("import_only", "true");
                    body.append("csrfmiddlewaretoken", csrfToken);

                    const wait = document.createElement("p");
                    wait.style.fontStyle = "italic";
                    wait.textContent = `⏳ Please wait... Importing ${savedCount} saved file(s).`;
                    messagesDiv.appendChild(wait);

                    fetch("{% url 'file-upload' %}", {
                        method: "POST",
                        body: body,
                        headers: { "X-CSRFToken": csrfToken }
                    })
                        .then(res => res.json().then(data => ({ ok: res.ok, data: data })))
                        .then(function (r) {
                            wait.remove();
                            if (r.ok) {
                                addLine("✓ Import complete", null, r.data.message);
                            } else {
                                addLine("✗ Import failed: " + (r.data.error || "unknown error"), "red");
                            }
                        })
                        .catch(function () {
                            wait.remove();
                            addLine("✗ Import request failed.", "red");
                        })
                        .finally(function () {
                            uploading = false;
                            refreshControls();
                        });
                }
            }
        };
    </script>
</body>
</html>
