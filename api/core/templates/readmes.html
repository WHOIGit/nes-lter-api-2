<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>READMEs for Cruise {{ cruise|upper }}</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      line-height: 1.6;
    }

    .wrap {
      max-width: 780px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 1rem;
    }

    ul {
      padding-left: 1.2rem;
    }

    li {
      margin-bottom: .6rem;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
<div class="wrap">

  <h1>📄 READMEs for Cruise {{ cruise|upper }}</h1>

  <ul>
    <li>
      <a href="/api/ctd/cruises/readme/{{ cruise }}"
         target="_blank">
        🌊 CTD README
      </a>
    </li>

    <li>
      <a href="/api/underway/readme/{{ cruise }}"
         target="_blank">
        🚢 Underway README
      </a>
    </li>

    <li>
      <a href="/api/events/readme/{{ cruise }}"
         target="_blank">
        📅 Events README
      </a>
    </li>
  </ul>

</div>
</body>
</html>
